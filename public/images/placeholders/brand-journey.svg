<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <rect width="1200" height="900" fill="#FFFDF5"/>
  <rect x="20" y="20" width="1160" height="860" rx="32" fill="#FFFFFF" stroke="#F0E2E4" stroke-width="4"/>
  <rect x="60" y="60" width="1080" height="100" rx="20" fill="#650000"/>
  <text x="600" y="120" font-family="sans-serif" font-size="32" font-weight="900" fill="#FAFA33" text-anchor="middle">BRANDS &amp; STARTUPS JOURNEY — 6 SIMPLE STEPS</text>
  
  <!-- Step Grid -->
  <g transform="translate(80, 200)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="320" height="180" rx="16" fill="#FFFDF5" stroke="#F0E2E4" stroke-width="2"/>
    <circle cx="50" cy="45" r="22" fill="#650000"/>
    <text x="50" y="52" font-family="sans-serif" font-size="18" font-weight="900" fill="#FAFA33" text-anchor="middle">1</text>
    <text x="90" y="50" font-family="sans-serif" font-size="20" font-weight="800" fill="#650000">Explore Locations</text>
    <text x="20" y="100" font-family="sans-serif" font-size="14" fill="#5F5F5F">Browse prime retail spaces, shelves, and end-cap displays.</text>

    <!-- Step 2 -->
    <rect x="360" y="0" width="320" height="180" rx="16" fill="#FFFDF5" stroke="#F0E2E4" stroke-width="2"/>
    <circle cx="410" cy="45" r="22" fill="#650000"/>
    <text x="410" y="52" font-family="sans-serif" font-size="18" font-weight="900" fill="#FAFA33" text-anchor="middle">2</text>
    <text x="450" y="50" font-family="sans-serif" font-size="20" font-weight="800" fill="#650000">Select Display Type</text>
    <text x="380" y="100" font-family="sans-serif" font-size="14" fill="#5F5F5F">Choose floor rack, counter stand, or shelf space size.</text>

    <!-- Step 3 -->
    <rect x="720" y="0" width="320" height="180" rx="16" fill="#FFFDF5" stroke="#F0E2E4" stroke-width="2"/>
    <circle cx="770" cy="45" r="22" fill="#650000"/>
    <text x="770" y="52" font-family="sans-serif" font-size="18" font-weight="900" fill="#FAFA33" text-anchor="middle">3</text>
    <text x="810" y="50" font-family="sans-serif" font-size="20" font-weight="800" fill="#650000">Book Flexible Slot</text>
    <text x="740" y="100" font-family="sans-serif" font-size="14" fill="#5F5F5F">Confirm rental duration with zero standalone store capex.</text>

    <!-- Step 4 -->
    <rect x="0" y="220" width="320" height="180" rx="16" fill="#FFFDF5" stroke="#F0E2E4" stroke-width="2"/>
    <circle cx="50" cy="265" r="22" fill="#650000"/>
    <text x="50" y="272" font-family="sans-serif" font-size="18" font-weight="900" fill="#FAFA33" text-anchor="middle">4</text>
    <text x="90" y="270" font-family="sans-serif" font-size="20" font-weight="800" fill="#650000">Deliver Stock</text>
    <text x="20" y="320" font-family="sans-serif" font-size="14" fill="#5F5F5F">Ship or drop off your products directly at the host store.</text>

    <!-- Step 5 -->
    <rect x="360" y="220" width="320" height="180" rx="16" fill="#FFFDF5" stroke="#F0E2E4" stroke-width="2"/>
    <circle cx="410" cy="265" r="22" fill="#650000"/>
    <text x="410" y="272" font-family="sans-serif" font-size="18" font-weight="900" fill="#FAFA33" text-anchor="middle">5</text>
    <text x="450" y="270" font-family="sans-serif" font-size="20" font-weight="800" fill="#650000">Display &amp; Sell</text>
    <text x="380" y="320" font-family="sans-serif" font-size="14" fill="#5F5F5F">Engage real shoppers in high-traffic physical stores.</text>

    <!-- Step 6 -->
    <rect x="720" y="220" width="320" height="180" rx="16" fill="#FFFDF5" stroke="#F0E2E4" stroke-width="2"/>
    <circle cx="770" cy="265" r="22" fill="#650000"/>
    <text x="770" y="272" font-family="sans-serif" font-size="18" font-weight="900" fill="#FAFA33" text-anchor="middle">6</text>
    <text x="810" y="270" font-family="sans-serif" font-size="20" font-weight="800" fill="#650000">Scale Retail Footprint</text>
    <text x="740" y="320" font-family="sans-serif" font-size="14" fill="#5F5F5F">Expand your offline distribution across multiple locations.</text>
  </g>

  <!-- Footer Banner -->
  <rect x="60" y="740" width="1080" height="100" rx="20" fill="#FFFBCC" stroke="#FAFA33" stroke-width="2"/>
  <text x="600" y="798" font-family="sans-serif" font-size="24" font-weight="900" fill="#650000" text-anchor="middle">Expand Your Brand Offline with Minimum Risk via Racks on Rent</text>
</svg>
